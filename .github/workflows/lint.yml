name: Lint

on:
  push:
    branches:
      - '**'
  pull_request:
    types: [ opened, synchronize, reopened ]

permissions:
  contents: read
  pull-requests: read

jobs:
  lint-ruff:
    strategy:
      matrix:
        python-version: [ '3.14' ]
    name: Ruff Check
    uses: SanctumLabs/ci-workflows/.github/workflows/python-lint-ruff.yml@main
    with:
      ruff-args: check
      python-version: ${{ matrix.python-version }}
      packager: poetry
